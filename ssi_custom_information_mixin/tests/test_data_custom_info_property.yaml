options:
  auto_refresh: true

scenarios:
  - name: "Create custom_info.property record"
    steps:
      - step: "Create record"
        action: "create"
        model: "custom_info.property"
        save_as: "record"
        values:
          name: "Property One"
          code: "PROP-01"
      - step: "Assert record created"
        action: "assert"
        target: "record"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Property One"
          code:
            type: "value"
            expected: "PROP-01"
          active:
            type: "value"
            expected: true
          field_type:
            type: "value"
            expected: "str"

  - name: "Duplicate non-slash code is rejected"
    steps:
      - step: "Create first record with code PROP-DUP-01"
        action: "create"
        model: "custom_info.property"
        save_as: "first"
        values:
          name: "Property One"
          code: "PROP-DUP-01"
      - step: "Create second record with the same code must fail"
        action: "create"
        model: "custom_info.property"
        expect_error:
          type: "UserError"
          message_contains: "Dupilicate code"
        values:
          name: "Property Two"
          code: "PROP-DUP-01"

  - name: "copy() appends ' (copy)' suffix to code"
    steps:
      - step: "Create original record"
        action: "create"
        model: "custom_info.property"
        save_as: "original"
        values:
          name: "Property Three"
          code: "PROP-02"
      - step: "Copy the record"
        action: "call"
        target: "original"
        method: "copy"
      - step: "Verify the duplicate record was created with the suffixed code"
        action: "search"
        model: "custom_info.property"
        domain: [["code", "=", "PROP-02 (copy)"]]
        save_as: "duplicate"
        expect_count: 1
