options:
  auto_refresh: true

scenarios:
  - name: "Create custom_info.category record"
    steps:
      - step: "Create record"
        action: "create"
        model: "custom_info.category"
        save_as: "record"
        values:
          name: "Category One"
          code: "CAT-01"
      - step: "Assert record created"
        action: "assert"
        target: "record"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Category One"
          code:
            type: "value"
            expected: "CAT-01"
          active:
            type: "value"
            expected: true

  - name: "Duplicate non-slash code is rejected"
    steps:
      - step: "Create first record with code CAT-DUP-01"
        action: "create"
        model: "custom_info.category"
        save_as: "first"
        values:
          name: "Category One"
          code: "CAT-DUP-01"
      - step: "Create second record with the same code must fail"
        action: "create"
        model: "custom_info.category"
        expect_error:
          type: "UserError"
          message_contains: "Dupilicate code"
        values:
          name: "Category Two"
          code: "CAT-DUP-01"

  - name: "copy() appends ' (copy)' suffix to code"
    steps:
      - step: "Create original record"
        action: "create"
        model: "custom_info.category"
        save_as: "original"
        values:
          name: "Category Three"
          code: "CAT-02"
      - step: "Copy the record"
        action: "call"
        target: "original"
        method: "copy"
      - step: "Verify the duplicate record was created with the suffixed code"
        action: "search"
        model: "custom_info.category"
        domain: [["code", "=", "CAT-02 (copy)"]]
        save_as: "duplicate"
        expect_count: 1

  - name: "Categories are ordered by sequence"
    steps:
      - step: "Create category with sequence 20"
        action: "create"
        model: "custom_info.category"
        save_as: "second"
        values:
          name: "Zebra"
          code: "ORD-02"
          sequence: 20
      - step: "Create category with sequence 10"
        action: "create"
        model: "custom_info.category"
        save_as: "first"
        values:
          name: "Alpha"
          code: "ORD-01"
          sequence: 10
      - step: "Search first record using the model default order (sequence, name)"
        action: "search"
        model: "custom_info.category"
        domain: [["code", "in", ["ORD-01", "ORD-02"]]]
        save_as: "first_by_order"
        limit: 1
        expect_count: 1
      - step: "Assert first result is the lower-sequence record"
        action: "assert"
        target: "first_by_order"
        asserts:
          code:
            type: "value"
            expected: "ORD-01"
