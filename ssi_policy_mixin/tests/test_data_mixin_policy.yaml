options:
  auto_refresh: true

fake_models:
  classes:
    - "odoo.addons.ssi_policy_mixin.tests.fake_models:TestPolicy"
    - "odoo.addons.ssi_policy_mixin.tests.fake_models:TestPolicyType"

# Shared read-only lookups, replayed before every scenario (fresh registry
# each time, no state leaks between scenarios): the ir.model rows
# describing the "test_policy" and "test_policy_type" fake models, and
# the ir.model.fields row for "test_policy.confirm_ok" used by scenarios
# that build a policy.template_detail.
setup:
  steps:
    - step: "Find ir.model record for test_policy"
      action: "search"
      model: "ir.model"
      domain: [["model", "=", "test_policy"]]
      save_as: "model_test_policy"
      limit: 1
      expect_count: 1

    - step: "Find ir.model record for test_policy_type (unrelated model)"
      action: "search"
      model: "ir.model"
      domain: [["model", "=", "test_policy_type"]]
      save_as: "model_test_policy_type"
      limit: 1
      expect_count: 1

    - step: "Find ir.model.fields record for test_policy.confirm_ok"
      action: "search"
      model: "ir.model.fields"
      domain: [["model", "=", "test_policy"], ["name", "=", "confirm_ok"]]
      save_as: "field_confirm_ok"
      limit: 1
      expect_count: 1

scenarios:
  - name:
      "A test_policy document with no matching policy.template evaluates every policy
      boolean field to False"
    steps:
      - step: "Create the test_policy document with no policy.template in play yet"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "No Template Record"

      - step: "Assert no template was auto-selected and every policy field is False"
        action: "assert"
        target: "record"
        asserts:
          policy_template_id:
            type: "value"
            operator: "is_falsy"
          confirm_ok:
            type: "value"
            expected: false
          open_ok:
            type: "value"
            expected: false
          done_ok:
            type: "value"
            expected: false
          cancel_ok:
            type: "value"
            expected: false
          restart_ok:
            type: "value"
            expected: false

  - name:
      "allowed_policy_template_ids only lists policy.template records scoped to the
      document's own model"
    steps:
      - step: "Create a policy.template for model test_policy"
        action: "create"
        model: "policy.template"
        save_as: "template_test_policy"
        values:
          name: "Template For Test Policy"
          model_id: "REC: model_test_policy.id"
          python_code: "result = True"

      - step: "Create a policy.template for an unrelated model (test_policy_type)"
        action: "create"
        model: "policy.template"
        save_as: "template_other_model"
        values:
          name: "Template For Test Policy Type"
          model_id: "REC: model_test_policy_type.id"

      - step: "Create the test_policy document"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy Scope Record"

      - step:
          "Assert allowed_policy_template_ids contains exactly the test_policy template,
          not the unrelated-model one"
        action: "assert"
        target: "record"
        asserts:
          allowed_policy_template_ids:
            type: "m2m"
            check: "exact"
            expected_records:
              - "REC: template_test_policy"

      - step:
          "Deactivate the test_policy template so it does not leak into later scenarios"
        action: "write"
        target: "template_test_policy"
        values:
          active: false

      - step:
          "Deactivate the unrelated-model template so it does not leak into later
          scenarios"
        action: "write"
        target: "template_other_model"
        values:
          active: false

  - name:
      "policy_template_id drives a policy boolean field according to the evaluated
      python code of its detail line (True case)"
    steps:
      - step: "Create a policy.template for model test_policy"
        action: "create"
        model: "policy.template"
        save_as: "template_true"
        values:
          name: "Confirm Always Allowed"
          model_id: "REC: model_test_policy.id"
          python_code: "result = True"

      - step:
          "Create a detail line whose additional_python_code always evaluates confirm_ok
          to True"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_true"
        values:
          template_id: "REC: template_true.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "result = True"

      - step: "Create the test_policy document with the template explicitly assigned"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy True Record"
          policy_template_id: "REC: template_true.id"

      - step:
          "Assert the template is set and confirm_ok follows the evaluated python code"
        action: "assert"
        target: "record"
        asserts:
          policy_template_id:
            type: "m2o"
            expected: "REC: template_true"
          confirm_ok:
            type: "value"
            expected: true

      - step: "Deactivate the template so it does not leak into later scenarios"
        action: "write"
        target: "template_true"
        values:
          active: false

  - name:
      "policy_template_id drives a policy boolean field according to the evaluated
      python code of its detail line (False case)"
    steps:
      - step: "Create a policy.template for model test_policy"
        action: "create"
        model: "policy.template"
        save_as: "template_false"
        values:
          name: "Confirm Always Denied"
          model_id: "REC: model_test_policy.id"
          python_code: "result = True"

      - step:
          "Create a detail line whose additional_python_code always evaluates confirm_ok
          to False"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_false"
        values:
          template_id: "REC: template_false.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "result = False"

      - step: "Create the test_policy document with the template explicitly assigned"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy False Record"
          policy_template_id: "REC: template_false.id"

      - step:
          "Assert the template is set and confirm_ok follows the evaluated python code"
        action: "assert"
        target: "record"
        asserts:
          policy_template_id:
            type: "m2o"
            expected: "REC: template_false"
          confirm_ok:
            type: "value"
            expected: false

      - step: "Deactivate the template so it does not leak into later scenarios"
        action: "write"
        target: "template_false"
        values:
          active: false

  - name:
      "action_reload_policy_template re-selects the matching template and re-evaluates
      the policy field after the document's state changes"
    steps:
      - step: "Create a template that only applies while the document is in draft"
        action: "create"
        model: "policy.template"
        save_as: "template_draft"
        values:
          name: "Applies While Draft"
          model_id: "REC: model_test_policy.id"
          sequence: 5
          python_code: "result = document.state == 'draft'"

      - step: "Create its detail line: confirm_ok is True while this template applies"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_draft"
        values:
          template_id: "REC: template_draft.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "result = True"

      - step: "Create a template that only applies while the document is confirmed"
        action: "create"
        model: "policy.template"
        save_as: "template_confirm"
        values:
          name: "Applies While Confirm"
          model_id: "REC: model_test_policy.id"
          sequence: 10
          python_code: "result = document.state == 'confirm'"

      - step: "Create its detail line: confirm_ok is False while this template applies"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_confirm"
        values:
          template_id: "REC: template_confirm.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "result = False"

      - step:
          "Create the document without a template; create() auto-selects via
          _get_template_policy() while state is draft"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy Reload Record"

      - step: "Assert the draft template was auto-selected and confirm_ok is True"
        action: "assert"
        target: "record"
        asserts:
          state:
            type: "value"
            expected: "draft"
          policy_template_id:
            type: "m2o"
            expected: "REC: template_draft"
          confirm_ok:
            type: "value"
            expected: true

      - step: "Move the document to the confirm state"
        action: "call"
        target: "record"
        method: "action_confirm"
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Call action_reload_policy_template to re-evaluate the template selection"
        action: "call"
        target: "record"
        method: "action_reload_policy_template"

      - step:
          "Assert the confirm template is now selected and confirm_ok followed it to
          False"
        action: "assert"
        target: "record"
        asserts:
          policy_template_id:
            type: "m2o"
            expected: "REC: template_confirm"
          confirm_ok:
            type: "value"
            expected: false

      - step: "Deactivate the draft template so it does not leak into later scenarios"
        action: "write"
        target: "template_draft"
        values:
          active: false

      - step: "Deactivate the confirm template so it does not leak into later scenarios"
        action: "write"
        target: "template_confirm"
        values:
          active: false

  - name:
      "_get_template_policy picks the highest-sequence template when more than one
      matches (search order 'sequence desc')"
    steps:
      - step: "Create a low-sequence template that also matches"
        action: "create"
        model: "policy.template"
        save_as: "template_seq_low"
        values:
          name: "Low Sequence Always Matches"
          model_id: "REC: model_test_policy.id"
          sequence: 5
          python_code: "result = True"

      - step: "Detail line: if the low-sequence template wins, confirm_ok is False"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_seq_low"
        values:
          template_id: "REC: template_seq_low.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "result = False"

      - step: "Create a high-sequence template that also matches"
        action: "create"
        model: "policy.template"
        save_as: "template_seq_high"
        values:
          name: "High Sequence Always Matches"
          model_id: "REC: model_test_policy.id"
          sequence: 20
          python_code: "result = True"

      - step: "Detail line: if the high-sequence template wins, confirm_ok is True"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_seq_high"
        values:
          template_id: "REC: template_seq_high.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "result = True"

      - step:
          "Create the document without a template; both templates match, so the
          higher-sequence one must win"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy Sequence Record"

      - step:
          "Assert the high-sequence template was selected and confirm_ok followed it"
        action: "assert"
        target: "record"
        asserts:
          policy_template_id:
            type: "m2o"
            expected: "REC: template_seq_high"
          confirm_ok:
            type: "value"
            expected: true

      - step:
          "Deactivate the low-sequence template so it does not leak into later scenarios"
        action: "write"
        target: "template_seq_low"
        values:
          active: false

      - step:
          "Deactivate the high-sequence template so it does not leak into later
          scenarios"
        action: "write"
        target: "template_seq_high"
        values:
          active: false

  - name:
      "computation_method use_user is only evaluated for the acting user (as_user),
      never for the default superuser transaction"
    steps:
      - step:
          "Create the user allowed by the use_user detail line (base.group_erp_manager
          is required to read ir.model.fields, which _compute_policy needs for
          detail.field_id.name - base.group_user alone cannot read it)"
        action: "create"
        model: "res.users"
        save_as: "specific_user"
        values:
          name: "Policy Specific User"
          login: "policy.specific.user@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: base.group_erp_manager"

      - step: "Create a user not allowed by the use_user detail line"
        action: "create"
        model: "res.users"
        save_as: "other_user"
        values:
          name: "Policy Other User"
          login: "policy.other.user@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REF: base.group_erp_manager"

      - step: "Create the policy.template used by this scenario"
        action: "create"
        model: "policy.template"
        save_as: "template_user_scope"
        values:
          name: "Restricted By Specific User"
          model_id: "REC: model_test_policy.id"
          python_code: "result = True"

      - step: "Detail line: confirm_ok is only allowed for specific_user"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_use_user"
        values:
          template_id: "REC: template_user_scope.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_additional: false
          restrict_user: true
          computation_method: "use_user"
          user_ids:
            - - 6
              - 0
              - - "REC: specific_user.id"

      - step: "Create the document with the template explicitly assigned"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy User Scope Record"
          policy_template_id: "REC: template_user_scope.id"

      - step: "As specific_user: confirm_ok is allowed"
        action: "assert"
        target: "record"
        as_user: "specific_user"
        asserts:
          confirm_ok:
            type: "value"
            expected: true

      - step: "As other_user: confirm_ok is not allowed"
        action: "assert"
        target: "record"
        as_user: "other_user"
        asserts:
          confirm_ok:
            type: "value"
            expected: false

      - step: "Deactivate the template so it does not leak into later scenarios"
        action: "write"
        target: "template_user_scope"
        values:
          active: false

  - name:
      "computation_method use_group currently raises UserError instead of evaluating
      group membership - a pre-existing bug outside this refactor's scope, tracked as
      open-synergy/ssi-mixin#415, documented here instead of silently dropping coverage
      of this code path"
    steps:
      - step: "Create the group referenced by the use_group detail line"
        action: "create"
        model: "res.groups"
        save_as: "authorized_group"
        values:
          name: "Policy Authorized Group"

      - step: "Create a user who is a member of the group"
        action: "create"
        model: "res.users"
        save_as: "group_member"
        values:
          name: "Policy Group Member"
          login: "policy.group.member@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"
                - "REC: authorized_group.id"

      - step: "Create the policy.template used by this scenario"
        action: "create"
        model: "policy.template"
        save_as: "template_group_scope"
        values:
          name: "Restricted By Group"
          model_id: "REC: model_test_policy.id"
          python_code: "result = True"

      - step: "Detail line: confirm_ok is restricted to members of authorized_group"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_use_group"
        values:
          template_id: "REC: template_group_scope.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_additional: false
          restrict_user: true
          computation_method: "use_group"
          group_ids:
            - - 6
              - 0
              - - "REC: authorized_group.id"

      - step: "Create the document with the template explicitly assigned"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy Group Scope Record"
          policy_template_id: "REC: template_group_scope.id"

      - step:
          "Reading confirm_ok as a group member raises UserError instead of evaluating
          to True"
        action: "call"
        target: "record"
        method: "read"
        as_user: "group_member"
        args:
          - - "confirm_ok"
        expect_error:
          type: "UserError"
          message_contains: "Error evaluating conditions"

      - step: "Deactivate the template so it does not leak into later scenarios"
        action: "write"
        target: "template_group_scope"
        values:
          active: false

      - step:
          "Assert the deactivation was flushed (the next scenario's expect_error step
          has no other read to force it)"
        action: "assert"
        target: "template_group_scope"
        asserts:
          active:
            type: "value"
            expected: false

  - name: "A syntactically invalid policy.template python_code is rejected"
    steps:
      - step: "Create a policy.template with syntactically invalid python_code"
        action: "create"
        model: "policy.template"
        expect_error:
          type: "ValidationError"
        values:
          name: "Invalid Python Code"
          model_id: "REC: model_test_policy.id"
          python_code: "def bad(:"

  - name:
      "A policy.template whose python_code never assigns 'result' raises UserError when
      it is selected"
    steps:
      - step: "Create the document with no template selected yet"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy No Result Record"

      - step:
          "Create a policy.template whose python_code is valid Python but never assigns
          'result'"
        action: "create"
        model: "policy.template"
        save_as: "template_no_result"
        values:
          name: "Never Assigns Result"
          model_id: "REC: model_test_policy.id"
          python_code: "x = 1"

      - step:
          "action_reload_policy_template must raise UserError while evaluating the
          template"
        action: "call"
        target: "record"
        method: "action_reload_policy_template"
        expect_error:
          type: "UserError"
          message_contains: "Error evaluating conditions"

      - step: "Deactivate the template so it does not leak into later scenarios"
        action: "write"
        target: "template_no_result"
        values:
          active: false

  - name:
      "A policy.template_detail whose additional_python_code never assigns 'result'
      raises UserError when the policy field is read"
    steps:
      - step: "Create a policy.template that always matches"
        action: "create"
        model: "policy.template"
        save_as: "template_bad_detail"
        values:
          name: "Detail Never Assigns Result"
          model_id: "REC: model_test_policy.id"
          python_code: "result = True"

      - step:
          "Create a detail line whose additional_python_code is valid Python but never
          assigns 'result'"
        action: "create"
        model: "policy.template_detail"
        save_as: "detail_bad"
        values:
          template_id: "REC: template_bad_detail.id"
          field_id: "REC: field_confirm_ok.id"
          restrict_state: false
          restrict_user: false
          restrict_additional: true
          additional_python_code: "x = 1"

      - step: "Create the document with the template explicitly assigned"
        action: "create"
        model: "test_policy"
        save_as: "record"
        values:
          name: "Policy Bad Detail Record"
          policy_template_id: "REC: template_bad_detail.id"

      - step: "Reading confirm_ok triggers _compute_policy, which must raise UserError"
        action: "call"
        target: "record"
        method: "read"
        args:
          - - "confirm_ok"
        expect_error:
          type: "UserError"
          message_contains: "Error evaluating conditions"

      - step: "Deactivate the template so it does not leak into later scenarios"
        action: "write"
        target: "template_bad_detail"
        values:
          active: false

      - step:
          "Assert the deactivation was flushed (this is the last write in the file -
          nothing else forces a flush before fake_models teardown runs)"
        action: "assert"
        target: "template_bad_detail"
        asserts:
          active:
            type: "value"
            expected: false
