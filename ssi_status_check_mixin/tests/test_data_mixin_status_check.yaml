options:
  auto_refresh: true

fake_models:
  classes:
    - "odoo.addons.ssi_status_check_mixin.tests.fake_models:TestStatusCheckConsumer"

# Shared read-only lookup and fixtures replayed before every scenario (fresh
# registry each time, no state leaks between scenarios):
# - the ir.model row describing the "test_status_check_consumer" fake model
#   (declared in tests/fake_models.py, loaded via the fake_models: key
#   above), needed as status.check.template's required model_id;
# - a status.check.item usable by every scenario below. Its own
#   status_check_method/python_code only matter for
#   mixin.status_check._evaluate_status_check() (status_ok's non-bypass
#   path), which none of these scenarios rely on - they either force
#   status_ok via bypass_user_id, or only exercise
#   _compute_allowed_bypass_user_ids()/action_bypass_status_check(), which
#   never call _evaluate_status_check();
# - a test_status_check_consumer document to be referenced by
#   status.check.model/res_id (status.check._get_document() browses it).
setup:
  steps:
    - step: "Cari ir.model untuk test_status_check_consumer"
      action: "search"
      model: "ir.model"
      domain: [["model", "=", "test_status_check_consumer"]]
      save_as: "model_test_status_check_consumer"
      limit: 1
      expect_count: 1

    - step: "Buat status.check.item default (dipakai seluruh skenario)"
      action: "create"
      model: "status.check.item"
      save_as: "item"
      values:
        name: "Item Uji Status Check"
        # "/" sengaja dipakai (bukan literal tetap) - status.check.item kini
        # mewarisi mixin.master_data, yang menolak code non-"/" duplikat;
        # blok setup ini diputar ulang sebelum SETIAP skenario dalam
        # transaksi yang sama (tanpa rollback antar-skenario), jadi literal
        # tetap akan gagal pada replay kedua dan seterusnya.
        code: "/"
        status_check_method: "use_python"
        python_code: "result = False"

    - step: "Buat dokumen test_status_check_consumer yang dirujuk status.check"
      action: "create"
      model: "test_status_check_consumer"
      save_as: "doc"
      values:
        name: "Dokumen Uji Status Check"

scenarios:
  - name:
      "Kondisi kosong: dokumen tanpa status.check.template yang cocok punya
      status_check_ids kosong dan status_check_template_id falsy"
    steps:
      - step:
          "Assert dokumen segar dari setup belum terhubung ke template apa pun - belum
          ada status.check.template untuk model ini pada titik ini"
        action: "assert"
        target: "doc"
        asserts:
          status_check_template_id:
            type: "value"
            operator: "is_falsy"
          status_check_ids:
            type: "o2m"
            check: "count"
            expected_count: 0

  - name:
      "status_ok = True bila bypass_user_id terisi, terlepas dari hasil
      _evaluate_status_check"
    steps:
      - step: "Buat status.check.template"
        action: "create"
        model: "status.check.template"
        save_as: "template"
        values:
          name: "Template Bypass User"
          model_id: "REC: model_test_status_check_consumer.id"

      - step: "Buat status.check.template_detail"
        action: "create"
        model: "status.check.template_detail"
        save_as: "detail"
        values:
          template_id: "REC: template.id"
          status_check_item_id: "REC: item.id"
          bypass_method: "use_user"

      - step:
          "Buat status.check dengan bypass_user_id terisi (item.python_code
          mengembalikan False)"
        action: "create"
        model: "status.check"
        save_as: "check"
        values:
          model: "test_status_check_consumer"
          res_id: "REC: doc.id"
          template_id: "REC: template.id"
          template_detail_id: "REC: detail.id"
          bypass_user_id: "REC: user.id"

      - step: "Assert status_ok True walau _evaluate_status_check bernilai False"
        action: "assert"
        target: "check"
        asserts:
          status_ok:
            type: "value"
            expected: true

  - name:
      "_compute_allowed_bypass_user_ids mengumpulkan user dari bypass_user_ids langsung"
    steps:
      - step: "Buat user kandidat bypass"
        action: "create"
        model: "res.users"
        save_as: "bypass_user"
        values:
          name: "Bypass User Langsung"
          login: "bypass.user.langsung@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Buat status.check.template"
        action: "create"
        model: "status.check.template"
        save_as: "template"
        values:
          name: "Template Bypass User Ids"
          model_id: "REC: model_test_status_check_consumer.id"

      - step: "Buat status.check.template_detail dengan bypass_user_ids"
        action: "create"
        model: "status.check.template_detail"
        save_as: "detail"
        values:
          template_id: "REC: template.id"
          status_check_item_id: "REC: item.id"
          bypass_method: "use_user"
          bypass_user_ids:
            - - 6
              - 0
              - - "REC: bypass_user.id"

      - step: "Buat status.check"
        action: "create"
        model: "status.check"
        save_as: "check"
        values:
          model: "test_status_check_consumer"
          res_id: "REC: doc.id"
          template_id: "REC: template.id"
          template_detail_id: "REC: detail.id"

      - step: "Assert bypass_user muncul di allowed_bypass_user_ids"
        action: "assert"
        target: "check"
        asserts:
          allowed_bypass_user_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: bypass_user"

  - name:
      "_compute_allowed_bypass_user_ids mengumpulkan seluruh anggota bypass_group_ids"
    steps:
      - step: "Buat user anggota grup bypass 1"
        action: "create"
        model: "res.users"
        save_as: "group_member_1"
        values:
          name: "Anggota Grup Bypass 1"
          login: "anggota.grup.bypass1@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Buat user anggota grup bypass 2"
        action: "create"
        model: "res.users"
        save_as: "group_member_2"
        values:
          name: "Anggota Grup Bypass 2"
          login: "anggota.grup.bypass2@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Buat grup bypass berisi kedua user"
        action: "create"
        model: "res.groups"
        save_as: "bypass_group"
        values:
          name: "Grup Bypass Status Check"
          user_ids:
            - - 6
              - 0
              - - "REC: group_member_1.id"
                - "REC: group_member_2.id"

      - step: "Buat status.check.template"
        action: "create"
        model: "status.check.template"
        save_as: "template"
        values:
          name: "Template Bypass Group"
          model_id: "REC: model_test_status_check_consumer.id"

      - step: "Buat status.check.template_detail dengan bypass_group_ids"
        action: "create"
        model: "status.check.template_detail"
        save_as: "detail"
        values:
          template_id: "REC: template.id"
          status_check_item_id: "REC: item.id"
          bypass_method: "use_group"
          bypass_group_ids:
            - - 6
              - 0
              - - "REC: bypass_group.id"

      - step: "Buat status.check"
        action: "create"
        model: "status.check"
        save_as: "check"
        values:
          model: "test_status_check_consumer"
          res_id: "REC: doc.id"
          template_id: "REC: template.id"
          template_detail_id: "REC: detail.id"

      - step: "Assert seluruh anggota grup muncul di allowed_bypass_user_ids"
        action: "assert"
        target: "check"
        asserts:
          allowed_bypass_user_ids:
            type: "m2m"
            check: "contains"
            expected_records:
              - "REC: group_member_1"
              - "REC: group_member_2"

  - name:
      "action_bypass_status_check tidak menulis bypass_user_id bila user saat ini tidak
      ada di allowed_bypass_user_ids"
    steps:
      - step: "Buat user berwenang (masuk allowed list)"
        action: "create"
        model: "res.users"
        save_as: "authorized_user"
        values:
          name: "User Berwenang Bypass"
          login: "user.berwenang.bypass@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Buat user yang TIDAK berwenang"
        action: "create"
        model: "res.users"
        save_as: "unauthorized_user"
        values:
          name: "User Tidak Berwenang Bypass"
          login: "user.tidak.berwenang.bypass@example.com"
          group_ids:
            - - 6
              - 0
              - - "REF: base.group_user"

      - step: "Buat status.check.template"
        action: "create"
        model: "status.check.template"
        save_as: "template"
        values:
          name: "Template Unauthorized Bypass"
          model_id: "REC: model_test_status_check_consumer.id"

      - step:
          "Buat status.check.template_detail dengan bypass_user_ids hanya user berwenang"
        action: "create"
        model: "status.check.template_detail"
        save_as: "detail"
        values:
          template_id: "REC: template.id"
          status_check_item_id: "REC: item.id"
          bypass_method: "use_user"
          bypass_user_ids:
            - - 6
              - 0
              - - "REC: authorized_user.id"

      - step: "Buat status.check"
        action: "create"
        model: "status.check"
        save_as: "check"
        values:
          model: "test_status_check_consumer"
          res_id: "REC: doc.id"
          template_id: "REC: template.id"
          template_detail_id: "REC: detail.id"

      - step: "Panggil action_bypass_status_check sebagai user tidak berwenang"
        action: "call"
        target: "check"
        method: "action_bypass_status_check"
        as_user: "unauthorized_user"

      - step: "Assert bypass_user_id tetap kosong"
        action: "assert"
        target: "check"
        asserts:
          bypass_user_id:
            type: "value"
            operator: "is_falsy"

  - name:
      "bypass_method use_python dengan python_code yang tidak menyetel result['user']
      melempar UserError"
    steps:
      - step: "Buat status.check.template"
        action: "create"
        model: "status.check.template"
        save_as: "template"
        values:
          name: "Template Bypass Python Tanpa User"
          model_id: "REC: model_test_status_check_consumer.id"

      - step:
          "Buat status.check.template_detail bypass_method use_python; python_code
          menyetel result tapi tanpa key 'user'"
        action: "create"
        model: "status.check.template_detail"
        save_as: "detail"
        values:
          template_id: "REC: template.id"
          status_check_item_id: "REC: item.id"
          bypass_method: "use_python"
          python_code: "result = {'foo': True}"

      - step: "Buat status.check"
        action: "create"
        model: "status.check"
        save_as: "check"
        values:
          model: "test_status_check_consumer"
          res_id: "REC: doc.id"
          template_id: "REC: template.id"
          template_detail_id: "REC: detail.id"

      - step:
          "Panggil action_bypass_status_check harus melempar UserError 'No User defines
          on python code'"
        action: "call"
        target: "check"
        method: "action_bypass_status_check"
        expect_error:
          type: "UserError"
          message_contains: "No User defines on python code"

  - name:
      "create() memicu action_reload_status_check_template() -> baris status.check
      terbentuk sesuai detail template"
    steps:
      - step: "Buat status.check.template yang selalu match model ini"
        action: "create"
        model: "status.check.template"
        save_as: "auto_template"
        values:
          name: "Template Auto Select"
          model_id: "REC: model_test_status_check_consumer.id"
          python_code: "result = True"

      - step: "Ikat status.check.item ke template lewat status.check.template_detail"
        action: "create"
        model: "status.check.template_detail"
        save_as: "auto_detail"
        values:
          template_id: "REC: auto_template.id"
          status_check_item_id: "REC: item.id"

      - step:
          "Buat dokumen baru; create() mixin.status_check otomatis memanggil
          action_reload_status_check_template()"
        action: "create"
        model: "test_status_check_consumer"
        save_as: "auto_doc"
        values:
          name: "Dokumen Auto Template"

      - step: "Assert status_check_template_id terisi otomatis sesuai template"
        action: "assert"
        target: "auto_doc"
        asserts:
          status_check_template_id:
            type: "m2o"
            expected: "REC: auto_template"

      - step: "Assert status_check_ids berisi tepat satu baris"
        action: "assert"
        target: "auto_doc"
        asserts:
          status_check_ids:
            type: "o2m"
            check: "count"
            expected_count: 1

      - step:
          "Cari baris status.check yang terbentuk dan pastikan template_detail_id-nya
          cocok dengan detail template"
        action: "search"
        model: "status.check"
        domain:
          [
            ["res_id", "=", "REC: auto_doc.id"],
            ["model", "=", "test_status_check_consumer"],
            ["template_detail_id", "=", "REC: auto_detail.id"],
          ]
        save_as: "auto_check"
        expect_count: 1

      - step:
          "Nonaktifkan template agar tidak bocor ke skenario lain (search default hanya
          melihat template aktif)"
        action: "write"
        target: "auto_template"
        values:
          active: false

      - step:
          "Assert nonaktifasi ter-flush (ini write terakhir di berkas - tidak ada
          pembacaan lain yang memaksa flush sebelum teardown fake_models berjalan)"
        action: "assert"
        target: "auto_template"
        asserts:
          active:
            type: "value"
            expected: false
