fake_models:
  classes:
    - "odoo.addons.ssi_decorator.tests.fake_models:TestDecorator"

scenarios:
  - name: "Dekorator pre_confirm_check menempelkan marker dengan argumen yang benar"
    steps:
      - step: "Create test_decorator record"
        action: "create"
        model: "test_decorator"
        save_as: "record"
        values:
          name: "Test Decorator Record"

      - step: "Assert marker _pre_confirm_check menempel dengan argumen yang benar"
        action: "assert"
        target: "record"
        asserts:
          _test_decorator_pre_confirm_check._pre_confirm_check:
            type: "value"
            expected: "EVAL: ('test_decorator_marker',)"

  - name: "_add_view_element ditolak saat XML ID QWeb tidak ditemukan"
    steps:
      - step: "Create test_decorator record"
        action: "create"
        model: "test_decorator"
        save_as: "record"
        values:
          name: "Test Decorator Record"

      - step:
          "Panggil _add_view_element dengan qweb_template_xml_id yang tidak ada di
          database (view_arch tidak relevan di sini karena ir.qweb._render melempar
          error sebelum view_arch dibaca)"
        action: "call"
        target: "record"
        method: "_add_view_element"
        kwargs:
          view_arch: '<form><group name="left"/></form>'
          qweb_template_xml_id: "ssi_decorator.does_not_exist"
          xpath: "//group[@name='left']"
          position: "after"
        expect_error:
          type: "MissingError"
